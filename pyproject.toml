[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsh-feiyu-board"
version = "1.9.0"
description = "小飞鱼画板：用文本 DSL 画手绘风格图片"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.5",
    "numpy>=1.24",
    "Pillow>=10.0",
]

[project.scripts]
fyb = "fyb.cli:main"

[tool.setuptools]
packages = ["fyb"]
